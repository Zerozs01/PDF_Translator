<!doctype html>
<html lang="en" style="background-color: #0a0c10; color: #fff;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <title>PDF_TRANSLATE</title>
    <script>
      console.log('[DIAGNOSTIC] Window loaded at:', window.location.href);
      window.__appStartTime = performance.now();
      window.addEventListener('error', function(e) {
        console.error('[BOOT ERROR]', e.message, e.filename, e.lineno, e.error);
        var banner = document.getElementById('boot-fallback-banner');
        if (banner) {
          banner.innerHTML = '<span style="color:#ef4444; font-weight:bold;">เกิดข้อผิดพลาดในการโหลดโมดูล:</span><br/><br/>' +
            (e.message || 'Unknown error') + '<br/><br/><span style="color:#64748b; font-size:11px;">' + (e.filename || '') + ':' + e.lineno + '</span>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[UNHANDLED REJECTION]', e.reason);
      });
    </script>
  </head>
  <body style="background-color: #0a0c10; color: #fff; margin: 0; min-height: 100vh;">
    <div id="root">
      <div id="boot-fallback-banner" style="display: flex; flex-direction: column; height: 100vh; width: 100vw; align-items: center; justify-content: center; font-family: sans-serif; color: #94a3b8; font-size: 14px; text-align: center; padding: 24px; box-sizing: border-box;">
        <div style="width: 24px; height: 24px; border: 2px solid #6366f1; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
        กำลังเริ่มต้นระบบ PDF Translator...
        <span style="font-size: 11px; color: #475569; margin-top: 8px;">หากใช้เวลานานเกินปกติ กรุณาตรวจสอบแท็บ Console หรือ Network ใน DevTools</span>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
